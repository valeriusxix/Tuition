name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: node -v
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build web (runs the no-secrets guard first)
        run: npm run build
